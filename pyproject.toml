[project]
name = "noren"
dynamic = ["version"]
description = "Send selected files from one git repository to another as a single commit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "minamik", email = "10973755+minamikik@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.urls]
Repository = "https://github.com/sync-dev-org/noren"
Documentation = "https://sync-dev-org.github.io/noren/"

[project.scripts]
noren = "noren.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
tag_regex = "^v(?P<version>[^/]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v*"]

[tool.hatch.build.hooks.vcs]
version-file = "src/noren/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.nf/", "/.github/", "/noren.yaml", "/noren-words.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/noren"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.7,<10",
    "mkdocs-static-i18n>=1.3.1,<2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = ["req(id): the adopted spec item that the test verifies"]
testpaths = ["tests"]
